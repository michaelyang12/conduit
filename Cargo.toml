[package]
name = "conduit"
version = "0.2.0"
edition = "2024"
description = "Opinionated LLM client for CLI tools: one prompt in, text or JSON out, across OpenAI, Anthropic, Ollama and any OpenAI-compatible server."
repository = "https://github.com/michaelyang12/conduit"

[features]
default = ["setup"]
setup = ["dep:dialoguer", "dep:console"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
console = { version = "0.16.6", optional = true }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"], optional = true }
tokio = { version = "1.54.1", features = ["process", "time", "io-util"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
