[package]
name = "conduit"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
colored = "2"
async-openai = { version = "0.31", features = ["responses"] }
serde_json = "1.0"
dotenvy = "0.15"
